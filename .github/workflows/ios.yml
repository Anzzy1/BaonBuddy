name: iOS unsigned build

# Builds an unsigned BaonBuddy.ipa on a cloud Mac (no Mac at home needed).
# Download the artifact, then sign + install it with Sideloadly on Windows.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (static export)
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          rm -rf build/Payload build/BaonBuddy-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/App.app
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload BaonBuddy-unsigned.ipa
          ls -lh BaonBuddy-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BaonBuddy-unsigned-ipa
          path: ios/App/build/BaonBuddy-unsigned.ipa
          if-no-files-found: error
